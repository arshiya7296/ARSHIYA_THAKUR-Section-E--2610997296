<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Event Information</title>
    <!-- Link external CSS file named style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 id="fest-heading">Annual College Fest</h1>

    <!-- Task 2 & 6: div tag to create a separate section for event information -->
    <div class="event-info">
        <!-- Task 3 & 4: Event details in paragraphs with spans for highlighting -->
        <p>Event Name: <span class="event-highlight">Ignite 2026</span></p>
        <p>Date: 25th November 2026</p>
        <p>Venue: <span class="venue-highlight">Main Auditorium</span></p>
        <p>Organizer: Student Cultural Committee</p>
    </div>

</body>
</html>
